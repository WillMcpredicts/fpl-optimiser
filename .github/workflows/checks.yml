name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx next build
        env:
          # The build must not need real credentials; pages fetch at request time.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile ingestion
        run: python -m compileall -q ingest
      - name: Unit checks that need no network
        run: python ingest/tests.py
